server.port=8080
spring.application.name=employee-management

# 正式環境は PostgreSQL のみ（SQLite は legacy プロファイル sqlite のみ）
spring.profiles.default=postgres

spring.datasource.url=jdbc:postgresql://localhost:5432/employee_mgmt
spring.datasource.username=employee_app
spring.datasource.password=employee_app_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=true

spring.jackson.default-property-inclusion=non_null

# 毎日 01:00 (JST) にイベント状態を自動メンテナンス
app.client-event.status-maintenance-cron=0 0 1 * * *

# イベントリマインドメール（参加者の employee_personal.email 宛）
app.client-event.reminder.enabled=false
app.client-event.reminder.days-before=1,3
app.client-event.reminder-cron=0 0 8 * * *

# SMTP 設定（app.mail.enabled=true にするとシステム内メール送信が有効）
# bitcross.co.jp の SMTP 情報は IT 管理者に確認してください
app.mail.enabled=false
app.mail.from=hr@bitcross.co.jp
spring.mail.host=mail.bitcross.co.jp
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 案件・選考・配属
app.project-candidate.allow-direct-confirm=true
app.employee-status.maintenance.enabled=true
app.employee-status.maintenance-cron=0 30 1 * * *
app.employee-status.ending-soon-days=30
app.employee-status.auto-apply=false
app.employee-status.revert-on-confirm=false
app.project.cancel-followup-days=3
app.project.cancel-followup-email-enabled=false
app.project.cancel-followup-reminder-cron=0 0 9 * * *

# ファイル管理（storage-dir に実ファイルを保存し、DB には絶対パスのみ記録）
# 例: app.files.storage-dir=C:/data/employee-files
app.files.storage-dir=./data/files
app.files.max-size-bytes=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
