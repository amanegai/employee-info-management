# レガシー SQLite プロファイル（開発・移行用のみ。本番では使用しない）
# 使用: --spring.profiles.active=sqlite

spring.datasource.url=jdbc:sqlite:./data/employees.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:detail-schema.sql,classpath:auth-schema.sql,classpath:event-participation-schema.sql,classpath:client-meeting-schema.sql,classpath:project-workflow-schema.sql
spring.sql.init.data-locations=classpath:data.sql,classpath:detail-data.sql
spring.sql.init.continue-on-error=true

spring.flyway.enabled=false
