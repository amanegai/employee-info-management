# 社員情報管理 — 社内サーバー Docker Compose デプロイ

# 使い方: deploy.env.example を .env にコピー → docker compose up -d --build

# name: フォルダ名に日本語が含まれる場合、Docker はプロジェクト名を自動生成できないため明示指定が必要



name: employee-mgmt



services:

  postgres:

    image: postgres:16-alpine

    container_name: employee-mgmt-db

    restart: unless-stopped

    environment:

      POSTGRES_DB: employee_mgmt

      POSTGRES_USER: employee_app

      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env に DB_PASSWORD を設定してください}

      TZ: Asia/Tokyo

    volumes:

      - pgdata:/var/lib/postgresql/data

    ports:

      - "5432:5432"

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U employee_app -d employee_mgmt"]

      interval: 5s

      timeout: 5s

      retries: 10



  app:

    build:

      context: .

      dockerfile: Dockerfile

    image: employee-management:1.0.0

    container_name: employee-mgmt-app

    restart: unless-stopped

    depends_on:

      postgres:

        condition: service_healthy

    ports:

      - "8080:8080"

    environment:

      TZ: Asia/Tokyo

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/employee_mgmt

      SPRING_DATASOURCE_USERNAME: employee_app

      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      APP_FILES_STORAGE_DIR: /app/data/files

    volumes:

      - employee-files:/app/data/files

      # 任意: SMTP 等の上書き設定（サーバーで config/application-local.properties を作成）

      # - ./config:/app/config:ro



volumes:

  pgdata:

  employee-files:


